name: CI/CD Pipeline

on:
  push:
    branches: [ main ] # 當程式碼推送到 main 分支時觸發

jobs:
  # 階段一：持續整合 (CI)
  test:
    runs-on: ubuntu-latest
    steps:
    - name: 複製 GitHub 程式碼
      uses: actions/checkout@v4

    - name: 設定 Node.js 環境
      uses: actions/setup-node@v4
      with:
        node-version: 18

    - name: 安裝相依套件
      run: npm install
    
    - name: 修正 Jest 執行檔權限
      run: chmod +x ./node_modules/.bin/jest

    - name: 執行單元測試
      run: npm test

  # 階段二：持續部署 (CD)
  deploy:
    needs: test # 必須等 test 成功通過才會執行部署
    runs-on: ubuntu-latest
    steps:
    - name: 遠端 SSH 連線並部署
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: '219.70.47.7'
        username: 'root'
        password: ${{ secrets.SERVER_PASSWORD }}
        port: 22
        script: |
          # 1. 強制 apt-get 使用 IPv4 避開網路斷線問題，並安裝 Node.js 與 npm
          apt-get update -o Acquire::ForceIPv4=true -y
          
          if ! command -v node &> /dev/null; then
            apt-get install -o Acquire::ForceIPv4=true -y nodejs
          fi
          
          if ! command -v npm &> /dev/null; then
            apt-get install -o Acquire::ForceIPv4=true -y npm
          fi
          
          if ! command -v pm2 &> /dev/null; then
            npm install -g pm2
          fi

          # 2. 確保進入正確的網頁根目錄
          mkdir -p /var/www
          cd /var/www

          # 3. 清理舊目錄，並使用純文字變數組合網址，避免斜線被吞掉
          rm -rf ci-cd-action-deploy
          
          GH_URL="https://github.com"
          REPO_PATH="orozcohsu/ci-cd-action-deploy.git"
          git clone "${GH_URL}/${REPO_PATH}"
          
          cd ci-cd-action-deploy

          # 4. 安裝生產環境套件並用 PM2 啟動/重啟 3000 埠服務
          npm install --production
          pm2 delete "my-add-app" || true
          pm2 start server.js --name "my-add-app"
