name: CI/CD Pipeline

on:
  push:
    branches: [ main ] # 當程式碼推送到 main 分支時觸發

jobs:
  # 階段一：持續整合 (CI)
  test:
    runs-on: ubuntu-latest
    steps:
    - name: 複製 GitHub 程式碼
      uses: actions/checkout@v4

    - name: 設定 Node.js 環境
      uses: actions/setup-node@v4
      with:
        node-version: 18

    - name: 安裝相依套件
      run: npm install
    
    - name: 修正 Jest 執行檔權限
      run: chmod +x ./node_modules/.bin/jest

    - name: 執行單元測試
      run: npm test

  # 階段二：持續部署 (CD)
  deploy:
    needs: test # 必須等 test 成功通過才會執行部署
    runs-on: ubuntu-latest
    steps:
    - name: 遠端 SSH 連線並部署
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: '219.70.47.7'
        username: 'root'
        password: ${{ secrets.SERVER_PASSWORD }}
        port: 22
        script: |
          # 1. 自動修復主機軟體源：將斷線的 ossplanet 替換為官方預設穩定源
          if grep -q "ossplanet.net" /etc/apt/sources.list /etc/apt/sources.list.d/* 2>/dev/null; then
            sed -i 's/mirror.ossplanet.net/archive.raspbian.org/g' /etc/apt/sources.list /etc/apt/sources.list.d/* 2>/dev/null || true
          fi

          # 強制更新套件庫清單
          apt-get update -y
          
          # 2. 安裝 Node.js 與 npm
          if ! command -v node &> /dev/null; then
            apt-get install -y nodejs
          fi
          
          if ! command -v npm &> /dev/null; then
            apt-get install -y npm
          fi
          
          if ! command -v pm2 &> /dev/null; then
            npm install -g pm2
          fi

          # 3. 進入網頁根目錄
          mkdir -p /var/www
          cd /var/www

          # 4. 清理舊目錄並重新 Clone 確保代碼最新
          rm -rf ci-cd-action-deploy
          
          GH_URL="https://github.com"
          REPO_PATH="orozcohsu/ci-cd-action-deploy.git"
          git clone "${GH_URL}/${REPO_PATH}"
          
          cd ci-cd-action-deploy

          # 5. 安裝生產環境套件並用 PM2 啟動/重啟 3000 埠服務
          npm install --production
          pm2 delete "my-add-app" || true
          pm2 start server.js --name "my-add-app"

