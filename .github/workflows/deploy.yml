name: CI/CD Pipeline

on:
  push:
    branches: [ main ] # 當程式碼推送到 main 分支時觸發

jobs:
  # 階段一：持續整合 (CI)
  test:
    runs-on: ubuntu-latest
    steps:
    - name: 複製 GitHub 程式碼
      uses: actions/checkout@v4

    - name: 設定 Node.js 環境
      uses: actions/setup-node@v4
      with:
        node-version: 18

    - name: 安裝相依套件
      run: npm install
    
    - name: 修正 Jest 執行檔權限
      run: chmod +x ./node_modules/.bin/jest

    - name: 執行單元測試
      run: npm test

  # 階段二：持續部署 (CD)
  deploy:
    needs: test # 必須等 test 成功通過才會執行部署
    runs-on: ubuntu-latest
    steps:
    - name: 遠端 SSH 連線並部署
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: '219.70.47.7'
        username: 'root'
        password: ${{ secrets.SERVER_PASSWORD }}
        port: 22
        script: |
          # 1. 確保基礎目錄存在並進入
          mkdir -p /var/www
          cd /var/www

          # 2. 清理舊目錄並重新 Clone 確保代碼最新
          rm -rf ci-cd-action-deploy
          
          GH_URL="https://github.com"
          REPO_PATH="orozcohsu/ci-cd-action-deploy.git"
          git clone "${GH_URL}/${REPO_PATH}"
          
          cd ci-cd-action-deploy

          # 3. 安裝生產環境套件
          npm install --production

          # 4. 使用 PM2 智慧重啟/啟動 3000 埠服務
          # 說明：使用 restart 可以讓既有服務無縫重啟，若服務不存在則自動觸發 start
          pm2 restart server.js --name "my-add-app" || pm2 start server.js --name "my-add-app"

